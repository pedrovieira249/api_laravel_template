# CI: o mesmo portão de qualidade do `make check`, mais cobertura.
# Roda em todo push e pull request para main. MySQL e Redis sobem como "services"
# (containers ao lado do job) e o PHP 8.5 vem do shivammathur/setup-php, sem Docker da app.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint, Larastan, Pest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
          MYSQL_USER: app
          MYSQL_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: app_test
      DB_USERNAME: app
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      CONCURRENCY_DRIVER: sync
      TELESCOPE_ENABLED: 'false'
      PULSE_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5 + extensões (as mesmas do Dockerfile)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, bcmath, intl, zip, opcache, pcntl, redis, pcov
          coverage: pcov
          ini-values: pcov.directory=${{ github.workspace }}

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (estilo)
        run: vendor/bin/pint --test

      - name: Larastan (nível 9)
        run: vendor/bin/phpstan analyze --no-progress --memory-limit=1G

      - name: Architecture tests
        run: vendor/bin/pest --testsuite=Architecture --compact

      - name: Pest + cobertura mínima 80%
        run: vendor/bin/pest --coverage --min=80 --compact

      - name: Type coverage 100%
        run: vendor/bin/pest --type-coverage --min=100 --compact
