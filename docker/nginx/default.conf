# Um "server" é um site (virtual host). Toda diretiva "location" vive dentro de um.
server {
    listen 80;
    server_name _;

    # Só o que está em public/ é servido. O resto do projeto fica inacessível por HTTP.
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Precisa ser >= post_max_size do app.ini. O default do nginx é 1M: barraria uploads antes do PHP.
    client_max_body_size 80M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Front controller: se o arquivo ou pasta existir em public/, serve direto;
    # senão, entrega a URL inteira para index.php, que é onde o Laravel roteia.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Só index.php chega ao PHP. Qualquer outro .php (ex.: upload malicioso) cai no
    # "location /" e vira 404. Terceira camada junto com cgi.fix_pathinfo e limit_extensions.
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Nega arquivos ocultos (.env, .git, .htaccess), exceto .well-known (Let's Encrypt).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
