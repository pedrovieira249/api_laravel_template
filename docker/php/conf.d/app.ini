; ============================================================================
; app.ini: ajustes gerais do PHP (valem para php-fpm E para o CLI: artisan, pest, composer)
; Carregado automaticamente por estar em $PHP_INI_DIR/conf.d/
; ============================================================================

; Fuso horário padrão das funções de data do PHP (o Laravel ainda tem APP_TIMEZONE no .env).
date.timezone=America/Sao_Paulo

; Memória máxima por processo/request. Em dev pode ser generoso (Pest, Larastan, Rector usam muito).
; Em produção o php-fpm deve ter um valor bem menor: pm.max_children * memory_limit cabe na RAM.
memory_limit=2048M

; Tamanho máximo de um arquivo enviado via upload.
upload_max_filesize=64M

; Tamanho máximo do corpo do POST inteiro (arquivos + campos).
; Precisa ser MAIOR que upload_max_filesize, senão uploads acima de post_max_size falham
; silenciosamente ($_FILES vazio). O client_max_body_size do nginx acompanha este valor.
post_max_size=80M

; Cache de caminhos resolvidos (realpath). Laravel abre milhares de arquivos por request;
; o padrão (16K / 120s) é pequeno. Ganho de performance sem efeito colateral.
realpath_cache_size=4096K
realpath_cache_ttl=600

; ----------------------------------------------------------------------------
; Segurança
; ----------------------------------------------------------------------------

; Não envia o header "X-Powered-By: PHP/8.5" nas respostas (menos informação para atacantes).
expose_php=Off

; Com valor 1, o php-fpm "adivinha" o script quando a URL é /uploads/foto.jpg/x.php e pode
; executar foto.jpg como PHP. Com 0, só executa o caminho exato. Defesa clássica em nginx+fpm.
cgi.fix_pathinfo=0

; Proíbe include/require de URLs remotas (include 'http://...'). Já é Off por padrão;
; deixamos explícito para ninguém ligar sem perceber.
allow_url_include=Off

; O php-fpm procura arquivos ".user.ini" no caminho do script a cada request e aplica o que
; estiver lá (ex.: auto_prepend_file). Se alguém conseguir gravar um .user.ini em public/,
; vira execução de código. Valor vazio desativa o mecanismo.
user_ini.filename=

; Observações:
; - allow_url_fopen precisa ficar On no CLI (o Composer depende dele). O desligamento só para
;   requests web está no pool do php-fpm (php-fpm.d/www.conf).
; - disable_functions também está no pool, e não aqui, pelo mesmo motivo: Horizon, Pint, Pest
;   e o próprio Composer usam proc_open/pcntl no CLI.
; - session.* do PHP não importa: o Laravel gerencia sessão com o driver dele, não com a do PHP.
; - open_basedir não usamos: quebra Composer/vendor e dá falsa sensação de segurança.

; pcov (cobertura de testes). Em modo "auto" o pcov escolhe sozinho um diretório (src, lib ou
; app) e aqui existem app/ E src/: ele pegava só src/ e app/ aparecia com 0% de cobertura.
; Fixar a raiz do projeto faz phpunit.xml (<source>) decidir o que entra no relatório.
pcov.directory = /var/www/html
