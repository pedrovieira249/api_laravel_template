; ============================================================================
; opcache.ini: cache de bytecode. Sem ele o PHP recompila todo arquivo a cada request.
; Perfil de DESENVOLVIMENTO. Em produção (estágio "production" do Dockerfile) muda validate_timestamps e o JIT.
; ============================================================================

; Liga o OPcache para o php-fpm (requests web).
opcache.enable=1

; Desligado no CLI (artisan, pest): cada processo CLI teria seu próprio cache, que morre
; com o processo. Ganho quase nulo e pode mascarar problemas de cache em dev.
opcache.enable_cli=0

; Confere se o arquivo mudou no disco antes de usar o cache. OBRIGATÓRIO em dev, senão você
; edita o código e continua vendo a versão antiga. Em produção vira 0 (deploy reinicia o fpm).
opcache.validate_timestamps=1

; Com validate_timestamps=1, de quantos em quantos segundos conferir. 0 = a cada request.
opcache.revalidate_freq=0

; Memória compartilhada (MB) para o bytecode. 128 cobre Laravel + vendor com folga em dev.
opcache.memory_consumption=128

; Memória (MB) para strings internadas (nomes de classes, métodos, literais). Evita duplicação.
opcache.interned_strings_buffer=16

; Máximo de arquivos no cache. Laravel + vendor passa fácil de 10 mil (o padrão). O PHP
; arredonda para o próximo primo da tabela interna.
opcache.max_accelerated_files=20000

; 0 desliga o JIT. Em dev não ajuda e conflita com ferramentas de cobertura/debug (pcov, xdebug).
; Em produção medimos antes de ligar: em request web típico de Laravel o ganho é pequeno.
opcache.jit_buffer_size=0

; Mantém os docblocks no bytecode. Alguns pacotes leem anotações via Reflection; se for 0,
; eles quebram de forma misteriosa. Já é o padrão, fica explícito por segurança.
opcache.save_comments=1
