; ============================================================================
; www.conf: pool do php-fpm. Substitui o arquivo original da imagem.
; O que NÃO está aqui vem dos outros arquivos da imagem em php-fpm.d/:
;   docker.conf    -> logs para stderr, clear_env = no (variáveis do compose chegam ao PHP),
;                     catch_workers_output = yes
;   zz-docker.conf -> listen = 9000 (TCP, todas as interfaces)
; Não há "user"/"group" de propósito: o fpm sobe como o usuário "laravel" (não-root) e
; não pode trocar de usuário; se as diretivas existissem, ele logaria um WARNING a cada boot.
; ============================================================================

; Nome do pool. O nginx não vê isso; serve para logs e para o status.
[www]

; Como gerenciar os processos filhos (workers):
;   static  -> número fixo
;   dynamic -> mantém um mínimo de ociosos e cria até o máximo sob demanda (bom para dev)
;   ondemand -> cria só quando chega request, mata após ociosidade (economiza RAM)
pm = dynamic

; Máximo de workers simultâneos = máximo de requests em paralelo.
; Em produção a conta é: RAM disponível / memória média de um worker.
pm.max_children = 10

; Quantos workers sobem junto com o fpm.
pm.start_servers = 2

; Mínimo de workers ociosos esperando request (se cair abaixo, cria mais).
pm.min_spare_servers = 1

; Máximo de workers ociosos (acima disso, mata o excedente).
pm.max_spare_servers = 3

; Recicla o worker depois de N requests. Mitiga vazamento de memória de extensões/pacotes.
; 0 = nunca reciclar.
pm.max_requests = 500

; Mata o request que passar desse tempo, incluindo I/O (max_execution_time do PHP só conta CPU).
; Evita worker preso para sempre em uma chamada HTTP externa travada.
request_terminate_timeout = 60s

; Loga um backtrace de todo request mais lento que isso. Ótimo para achar gargalo em dev.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; Endpoint de status (workers ativos, fila, etc.). Só o nginx interno deve expor isso.
pm.status_path = /status

; Endpoint de saúde: responde "pong". Vai ser usado pelo healthcheck no compose.yaml.
ping.path = /ping
ping.response = pong

; Só executa arquivos com essa extensão. Mesmo que um upload malicioso chegue ao fpm com
; outra extensão, ele não roda. Já é o padrão; explícito para documentar.
security.limit_extensions = .php

; ----------------------------------------------------------------------------
; Hardening que vale SÓ para requests web (php_admin_* não pode ser sobrescrito por ini_set()
; e não afeta o CLI, onde Composer/Horizon/Pint/Pest precisam dessas funções).
; ----------------------------------------------------------------------------

; Funções de execução de comandos do sistema. Se um atacante conseguir executar PHP arbitrário
; via web, não consegue escalar para shell. ATENÇÃO: o driver "process" do
; Concurrency facade usa proc_open; se formos usá-lo em request web, remover proc_open daqui.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,proc_open,pcntl_exec

; file_get_contents('http://...') e afins desligados no web: reduz SSRF por descuido.
; O Http client do Laravel (Guzzle/cURL), SMTP e S3 não dependem disso.
php_admin_flag[allow_url_fopen] = off
